# The desktop product's checks, on every push and every pull request.
#
# **Windows only, and that is not a shortcut.** The engine loads PDFium as a native
# library, the shell is Tauri against WebView2, and the installers are MSI and NSIS.
# Running the checks on Linux would test a configuration this product does not ship, and
# pass while the one it does ship was broken.
#
# Three jobs rather than one, because they fail for unrelated reasons and a person reading
# a red build should be able to tell which half of the product is unhappy without opening
# a log.
#
# What this cannot do yet: sign anything. The certificate is sprint 10 and blocked on
# procurement. The signing step goes in `installers` when it arrives, and is deliberately
# absent rather than stubbed — a step that pretends to sign is worse than no step.

name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop/engine/requirements.txt

      # Installed from the pinned file rather than resolved fresh. The versions in it are
      # the ones the licence audit in the About box names, and a build that quietly picks
      # up a newer PDFium is a build whose legal statement is out of date.
      - name: install pinned dependencies
        run: python -m pip install --require-hashes=false -r requirements.txt

      # `run_suites.py` reports skipped suites as loudly as failing ones. On a clean
      # checkout most of the fixture corpus is absent by design — those documents are
      # third-party and this repository is public — so the summary it prints is the
      # honest account of what this run did and did not cover.
      - name: run the suites
        run: python run_suites.py

  window:
    name: window
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - run: npm ci

      # Version first: it is the cheapest check here and the one whose failure invalidates
      # an installer rather than a test.
      - name: version agreement
        run: node scripts/check-version.mjs

      # The About box states which third-party software is inside the installer and under
      # what licence. Nothing keeps that in step with what is actually pinned, so a bumped
      # dependency would leave a legal statement describing software we no longer ship.
      - name: licences
        run: node scripts/check-credits.mjs

      - name: types
        run: npm run typecheck

      - name: strings
        run: npm run check:i18n

      - name: accessibility
        run: npm run check:a11y

      - name: build
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: rust tests
        working-directory: desktop/app/src-tauri
        run: cargo test --lib

      # Warnings are not failures here yet. Making them one is a decision for when the
      # tree is clean and staying clean; announcing them keeps that visible in the
      # meantime rather than letting them accumulate unread.
      - name: rust warnings
        working-directory: desktop/app/src-tauri
        run: cargo clippy --lib --no-deps 2>&1 | Select-String -Pattern "^warning" -Context 0,3
        continue-on-error: true

  # The system map is developer tooling, not part of the product — so it gets a job of its
  # own rather than a step inside `window`. A red build here means the planning documents
  # moved and the map did not, which is worth knowing and is not a reason to distrust the
  # installers; keeping it separate is what lets a person read the two apart at a glance.
  #
  # No `npm ci`: the generator is plain Node against five Markdown files and has no
  # dependencies at all. The viewer, which does have them, is not built here — nothing
  # ships it, so nothing has to prove it compiles on a clean machine.
  map:
    name: system map
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Refuses rather than guesses: a sprint blocked on an id nobody defines, a decision
      # blocking a sprint already closed, weights that do not reach a hundred, or a
      # headline percentage that disagrees with the sum of the parts.
      - name: the map still matches the documents
        working-directory: desktop/visualization
        run: npm run map:check

  installers:
    name: installers
    # Only on main and only after both halves are green: a bundle takes minutes and there
    # is nothing to learn from building one on top of code that does not compile.
    needs: [engine, window]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/app/src-tauri

      - name: install engine dependencies
        working-directory: desktop/engine
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # The frozen engine is built here rather than on a development machine, which is the
      # point of this job: the binary that ships should be one nobody's local Python
      # version, PATH or half-finished experiment contributed to.
      - name: freeze the engine
        working-directory: desktop/engine
        run: python build.py

      - working-directory: desktop/app
        run: npm ci

      - name: bundle
        working-directory: desktop/app
        run: npm run bundle

      # Kept for every build on main, so a version can be gone back to without rebuilding
      # it — and so the installer somebody tests is the exact file CI produced.
      - name: keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.sha }}
          path: |
            desktop/app/src-tauri/target/release/bundle/msi/*.msi
            desktop/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
