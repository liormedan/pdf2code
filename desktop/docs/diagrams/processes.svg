<svg xmlns="http://www.w3.org/2000/svg" width="680" height="246" viewBox="0 0 680 246" role="img">
<title>שלושת התהליכים של pdf2code</title>
<desc>החלון ב-React קורא למעטפת Rust דרך invoke, והמעטפת מדברת עם מנוע פייתון דרך NDJSON על צינורות. המעטפת מחזיקה את המנוע, את הדיסק ואת החלטת ההרשאה.</desc>
<style>
text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.ts{font-size:12px}
.th{font-size:14px;font-weight:500}
rect{stroke-width:1}
.c-gray rect{fill:#F1EFE8;stroke:#B4B2A9}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#AFA9EC}
.c-purple .th{fill:#26215C}
.c-purple .ts{fill:#534AB7}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.lbl{fill:#5F5E5A;font-size:12px}
@media (prefers-color-scheme:dark){
.c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
.c-gray .th{fill:#D3D1C7}
.c-gray .ts{fill:#B4B2A9}
.c-purple rect{fill:#26215C;stroke:#534AB7}
.c-purple .th{fill:#CECBF6}
.c-purple .ts{fill:#AFA9EC}
.lbl{fill:#B4B2A9}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-purple"><rect x="40" y="50" width="160" height="56" rx="8"/><text class="th" x="120" y="70" text-anchor="middle" dominant-baseline="central">החלון</text><text class="ts" x="120" y="88" text-anchor="middle" dominant-baseline="central">React · WebView</text></g>
<g class="c-purple"><rect x="260" y="50" width="160" height="56" rx="8"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">המעטפת</text><text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">Rust · Tauri 2</text></g>
<g class="c-purple"><rect x="480" y="50" width="160" height="56" rx="8"/><text class="th" x="560" y="70" text-anchor="middle" dominant-baseline="central">המנוע</text><text class="ts" x="560" y="88" text-anchor="middle" dominant-baseline="central">Python · sidecar</text></g>

<line class="arr" x1="206" y1="78" x2="250" y2="78" marker-end="url(#arrow)"/>
<line class="arr" x1="426" y1="78" x2="470" y2="78" marker-end="url(#arrow)"/>
<text class="lbl" x="228" y="100" text-anchor="middle" dominant-baseline="central">invoke</text>
<text class="lbl" x="448" y="100" text-anchor="middle" dominant-baseline="central">NDJSON</text>

<line class="arr" x1="340" y1="112" x2="340" y2="142" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="170" y="150" width="340" height="56" rx="8"/><text class="th" x="340" y="170" text-anchor="middle" dominant-baseline="central">מה שהמעטפת מחזיקה</text><text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">המנוע · הדיסק · החלטת ההרשאה</text></g>
</svg>
