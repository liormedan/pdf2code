<svg xmlns="http://www.w3.org/2000/svg" width="680" height="246" viewBox="0 0 680 246" role="img">
<title>מסלול הסדנה — תוכנית אחת, שש תכונות</title>
<desc>מסמך אחד או יותר נכנסים לתוכנית, שהיא רשימה של עמוד, קובץ וסיבוב. pypdfium2 בונה ממנה מסמך חדש. אותה רשימה מבטאת סיבוב, שינוי סדר, מחיקה, חילוץ, פיצול ומיזוג.</desc>
<style>
text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.ts{font-size:12px}
.th{font-size:14px;font-weight:500}
rect{stroke-width:1}
.c-gray rect{fill:#F1EFE8;stroke:#B4B2A9}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#AFA9EC}
.c-purple .th{fill:#26215C}
.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#5DCAA5}
.c-teal .th{fill:#04342C}
.c-teal .ts{fill:#0F6E56}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){
.c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
.c-gray .th{fill:#D3D1C7}
.c-gray .ts{fill:#B4B2A9}
.c-purple rect{fill:#26215C;stroke:#534AB7}
.c-purple .th{fill:#CECBF6}
.c-purple .ts{fill:#AFA9EC}
.c-teal rect{fill:#04342C;stroke:#0F6E56}
.c-teal .th{fill:#9FE1CB}
.c-teal .ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="40" y="50" width="165" height="56" rx="8"/><text class="th" x="122" y="70" text-anchor="middle" dominant-baseline="central">המקורות</text><text class="ts" x="122" y="88" text-anchor="middle" dominant-baseline="central">מסמך אחד או יותר</text></g>
<g class="c-purple"><rect x="257" y="50" width="165" height="56" rx="8"/><text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">תוכנית אחת</text><text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">pypdfium2</text></g>
<g class="c-teal"><rect x="474" y="50" width="165" height="56" rx="8"/><text class="th" x="556" y="70" text-anchor="middle" dominant-baseline="central">מסמך חדש</text><text class="ts" x="556" y="88" text-anchor="middle" dominant-baseline="central">המקור לא נגע</text></g>

<line class="arr" x1="211" y1="78" x2="251" y2="78" marker-end="url(#arrow)"/>
<line class="arr" x1="428" y1="78" x2="468" y2="78" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="112" x2="340" y2="142" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="170" y="150" width="340" height="56" rx="8"/><text class="th" x="340" y="170" text-anchor="middle" dominant-baseline="central">שש תכונות מאותה רשימה</text><text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">סיבוב · סדר · מחיקה · חילוץ · פיצול · מיזוג</text></g>
</svg>
