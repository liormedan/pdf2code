<svg xmlns="http://www.w3.org/2000/svg" width="680" height="226" viewBox="0 0 680 226" role="img">
<title>מסלול ההמרה וספריות העיבוד</title>
<desc>המסמך נקרא בשני מסלולים מקבילים: שכבת טקסט על pdfminer.six עם פורט של אלגוריתם bidi, ושכבת ראסטר על pypdfium2 ו-Pillow. שתיהן מתחברות לפלט HTML או React.</desc>
<style>
text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.ts{font-size:12px}
.th{font-size:14px;font-weight:500}
rect{stroke-width:1}
.c-gray rect{fill:#F1EFE8;stroke:#B4B2A9}
.c-gray .th{fill:#2C2C2A}
.c-gray .ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#AFA9EC}
.c-purple .th{fill:#26215C}
.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#5DCAA5}
.c-teal .th{fill:#04342C}
.c-teal .ts{fill:#0F6E56}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
@media (prefers-color-scheme:dark){
.c-gray rect{fill:#2C2C2A;stroke:#5F5E5A}
.c-gray .th{fill:#D3D1C7}
.c-gray .ts{fill:#B4B2A9}
.c-purple rect{fill:#26215C;stroke:#534AB7}
.c-purple .th{fill:#CECBF6}
.c-purple .ts{fill:#AFA9EC}
.c-teal rect{fill:#04342C;stroke:#0F6E56}
.c-teal .th{fill:#9FE1CB}
.c-teal .ts{fill:#5DCAA5}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="40" y="76" width="150" height="56" rx="8"/><text class="th" x="115" y="96" text-anchor="middle" dominant-baseline="central">המסמך</text><text class="ts" x="115" y="114" text-anchor="middle" dominant-baseline="central">PDF</text></g>
<g class="c-purple"><rect x="250" y="40" width="190" height="56" rx="8"/><text class="th" x="345" y="60" text-anchor="middle" dominant-baseline="central">שכבת טקסט</text><text class="ts" x="345" y="78" text-anchor="middle" dominant-baseline="central">pdfminer.six · bidi</text></g>
<g class="c-purple"><rect x="250" y="130" width="190" height="56" rx="8"/><text class="th" x="345" y="150" text-anchor="middle" dominant-baseline="central">שכבת ראסטר</text><text class="ts" x="345" y="168" text-anchor="middle" dominant-baseline="central">pypdfium2 · Pillow</text></g>
<g class="c-teal"><rect x="500" y="76" width="140" height="56" rx="8"/><text class="th" x="570" y="96" text-anchor="middle" dominant-baseline="central">הפלט</text><text class="ts" x="570" y="114" text-anchor="middle" dominant-baseline="central">HTML · React</text></g>

