[package]
name = "pdf2code-desktop"
version = "0.1.0"
description = "PDF to Code — the installed application"
edition = "2021"
rust-version = "1.77"
publish = false

# The staticlib/cdylib pair is what lets the same crate be linked into a mobile shell
# later without restructuring. `rlib` is what src/main.rs links against on desktop.
[lib]
name = "pdf2code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Test-only: a runtime and #[tokio::test], to drive the sidecar watchdog loop without a
# real subprocess. Dev-dependencies do not reach the installer, so this does not lengthen
# the dependency list the customer is asked to audit.
[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the synchronisation primitives: a job's reply arrives on the reader thread and
# has to wake the async command that is awaiting it. Tauri already builds on tokio, so
# this adds a name rather than a dependency.
# `time` is for the watchdog in sidecar.rs, not for a runtime: Tauri already runs one.
tokio = { version = "1", features = ["sync", "time"] }
# The native file picker. Used only from Rust: the window calls our own command and
# never touches the plugin, so no dialog permission is granted to the WebView.
tauri-plugin-dialog = "2"
# The project store. Bundled rather than linked against whatever the machine has:
# an installed application cannot depend on a library that may not be there.
rusqlite = { version = "0.40", features = ["bundled"] }

# Opening a file with whatever the machine has registered for it. That is `ShellExecuteW`
# and not `explorer.exe`, for reasons deliver.rs explains at the call site.
#
# Not a new dependency in any meaningful sense: this exact version is already in the tree
# under Tauri and rusqlite, and naming it here enables three of its feature modules rather
# than fetching anything. It is also the thinnest of the Windows bindings — declarations,
# no macros, no runtime.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Debug info is what `link.exe` ran out of memory generating — LNK1102, on a machine
# with a nearly exhausted commit limit. It is also the cheapest thing to give up: we
# are not stepping through serde, and there are roughly four hundred of those.
[profile.dev]
# Enough for a backtrace with line numbers, at a fraction of the PDB.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies carry none at all.
debug = false

# A window that ships is a window built with optimisations and without a debug console.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
